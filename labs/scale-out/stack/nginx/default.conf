# The load balancer. One server in the pool, no opinion about failure.
#
# Worth knowing while you edit this:
#   upstream        the pool, and the policy - round robin unless you say
#                   least_conn or ip_hash, and each server can take a weight
#   max_fails       how many failures before a server is taken out
#   fail_timeout    for how long
#   proxy_next_upstream  which failures are worth trying the next server for

upstream app {
    server app1:3000;
}

server {
    listen 80;

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
    }
}
